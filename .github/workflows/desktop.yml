name: Desktop app

# The desktop app (docs/desktop.md) for macOS, Windows and Linux, released on GitHub on every push to main that touches
# the game. The version is the last desktop-v* tag with the patch bumped ([minor] or [major] in a commit message bumps
# that instead; a manual run picks). Only desktop-v* tags: they deploy nothing, and a prod release job must never take
# them (CLAUDE.md). Installed apps keep their game files at the dev server's build by themselves (desktop/update.mjs),
# so a new download is only needed when desktop/ changes.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'public/**'
      - 'desktop/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tools/manifest.ts'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

# One run at a time, never cancelled once started: two runs at once would pick the same version. A newer push
# replaces a run that is still waiting.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The next version, and the web build once, with the commit's BUILD_SHA like the dev server's image, so the app
  # starts on the same build.
  web:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          BUMP: ${{ inputs.bump }}
          MESSAGES: ${{ join(github.event.commits.*.message, ' ') }}
        run: |
          last=$(git tag -l 'desktop-v*' --sort=-v:refname | head -1)
          if [ -z "$last" ]; then
            version=$(node -p "require('./desktop/package.json').version")
          else
            IFS=. read -r major minor patch <<< "${last#desktop-v}"
            bump=${BUMP:-patch}
            case "$MESSAGES" in *'[major]'*) bump=major ;; *'[minor]'*) if [ "$bump" = patch ]; then bump=minor; fi ;; esac
            case "$bump" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              *) version="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Desktop app $version (after ${last:-no release yet})" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BUILD_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  app:
    needs: web
    strategy:
      matrix:
        include:
          - { os: macos-latest, name: mac }
          - { os: windows-latest, name: windows }
          - { os: ubuntu-latest, name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npm ci
        working-directory: desktop
      # Unsigned (docs/desktop.md).
      - run: npx electron-builder --publish never --config.extraMetadata.version="$VERSION"
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          VERSION: ${{ needs.web.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: paahde-${{ matrix.name }}
          path: |
            desktop/out/*.zip
            desktop/out/*.tar.gz
          compression-level: 0
          retention-days: 1

  release:
    needs: [web, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: paahde-*
          path: out
          merge-multiple: true
      # The files keep their names from release to release, so .../releases/latest/download/<file> is always the newest.
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.web.outputs.version }}
        run: |
          last=$(git tag -l 'desktop-v*' --sort=-v:refname | head -1)
          gh release create "desktop-v$VERSION" out/* --target "$GITHUB_SHA" --latest \
            --title "Desktop app $VERSION" --generate-notes ${last:+--notes-start-tag "$last"}
