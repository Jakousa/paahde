name: Desktop app

# The desktop app (docs/desktop.md) for macOS, Windows and Linux, released on GitHub when a push to main has [minor] or
# [major] in a commit message, or by a manual run; other pushes build nothing. The version is the last desktop-v* tag
# with that part bumped. Only desktop-v* tags: they deploy nothing, and a prod release job must never take them
# (CLAUDE.md). Installed apps keep their game files at the dev server's build by themselves (desktop/update.mjs), so a
# new release is only needed when desktop/ changes.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [minor, major]
        default: minor

permissions:
  contents: read

# No concurrency group: every push starts this workflow (most skip at once), and a group would let a skipped run
# replace a waiting release. Two releases at once would pick the same version; the second then fails on the tag.

jobs:
  # The next version, and the web build once, with the commit's BUILD_SHA like the dev server's image, so the app
  # starts on the same build.
  web:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(join(github.event.commits.*.message, ' '), '[minor]') ||
      contains(join(github.event.commits.*.message, ' '), '[major]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          BUMP: ${{ inputs.bump }}
          MESSAGES: ${{ join(github.event.commits.*.message, ' ') }}
        run: |
          last=$(git tag -l 'desktop-v*' --sort=-v:refname | head -1)
          if [ -z "$last" ]; then
            version=$(node -p "require('./desktop/package.json').version")
          else
            IFS=. read -r major minor patch <<< "${last#desktop-v}"
            bump=${BUMP:-minor}
            case "$MESSAGES" in *'[major]'*) bump=major ;; esac
            if [ "$bump" = major ]; then version="$((major + 1)).0.0"; else version="$major.$((minor + 1)).0"; fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Desktop app $version (after ${last:-no release yet})" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BUILD_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  app:
    needs: web
    strategy:
      matrix:
        include:
          - { os: macos-latest, name: mac }
          - { os: windows-latest, name: windows }
          - { os: ubuntu-latest, name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npm ci
        working-directory: desktop
      # Unsigned (docs/desktop.md).
      - run: npx electron-builder --publish never --config.extraMetadata.version="$VERSION"
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          VERSION: ${{ needs.web.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: paahde-${{ matrix.name }}
          path: |
            desktop/out/*.zip
            desktop/out/*.tar.gz
          compression-level: 0
          retention-days: 1

  release:
    needs: [web, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: paahde-*
          path: out
          merge-multiple: true
      # The files keep their names from release to release, so .../releases/latest/download/<file> is always the newest.
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.web.outputs.version }}
        run: |
          last=$(git tag -l 'desktop-v*' --sort=-v:refname | head -1)
          gh release create "desktop-v$VERSION" out/* --target "$GITHUB_SHA" --latest \
            --title "Desktop app $VERSION" --generate-notes ${last:+--notes-start-tag "$last"}
