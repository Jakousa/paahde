<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- The landing page's backdrop (src/landing.ts): flat layers of desert at golden hour, a crash site and
       a walker far off. Palette from docs/look.md. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a2c"/>
      <stop offset=".4" stop-color="#7a4433"/>
      <stop offset=".62" stop-color="#e0843a"/>
      <stop offset=".7" stop-color="#f4a95a"/>
    </linearGradient>
    <radialGradient id="glow" cx="1180" cy="470" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd58a" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#ffc070" stop-opacity=".22"/>
      <stop offset=".7" stop-color="#f0a050" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffd58a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <circle cx="1180" cy="470" r="38" fill="#fff1cc"/>

  <!-- Far: mesas and a walker. -->
  <path d="M120 600 L150 520 L300 516 L332 600 Z M1340 600 L1362 548 L1450 546 L1470 600 Z" fill="#d48a58"/>
  <g stroke="#c47a4c" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M640 520 L622 598 M640 520 L660 598 M640 520 L646 600"/>
  </g>
  <ellipse cx="640" cy="516" rx="16" ry="7" fill="#c47a4c"/>

  <!-- Far dunes. -->
  <path d="M0 610 Q300 570 620 596 T1200 588 T1600 600 V900 H0 Z" fill="#e2a064"/>

  <!-- Mid dunes, with the crash site: a hull nose-down in the sand, its tail up, and bits around it. -->
  <path d="M0 690 Q260 640 560 666 T1120 660 T1600 650 V900 H0 Z" fill="#b5602e"/>
  <g fill="#4a2214">
    <path d="M1000 672 L1086 600 Q1100 590 1112 600 L1124 614 L1048 676 Z"/>
    <path d="M1090 604 L1084 572 L1098 570 L1108 598 Z"/>
    <path d="M1136 668 L1146 654 L1166 656 L1170 670 Z"/>
    <path d="M950 674 L958 664 L972 668 L970 676 Z"/>
  </g>

  <!-- Near dune. -->
  <path d="M0 790 Q360 728 760 760 T1600 736 V900 H0 Z" fill="#5a2a18"/>
</svg>
