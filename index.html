<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dadajam</title>
    <link rel="icon" href="data:," />
    <style>
      /* Every bit of text in the game is monospace. */
      :root { --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: var(--mono); }
      canvas { display: block; }
      /* Stats line: off unless "Show stats" is ticked in the Esc menu (src/menu.ts). */
      #info { position: fixed; top: 8px; left: 8px; color: #ccc; font: 12px var(--mono); display: none;
        pointer-events: none; text-shadow: 0 1px 2px #000; }
      /* Loading cover: up from the first paint until the bunker and player model are in (src/main.ts). The bar
         fills as models load; --p is set from the loading manager. */
      #cover { position: fixed; inset: 0; z-index: 25; background: #111; pointer-events: none; transition: opacity .4s;
        display: grid; place-items: center; }
      #cover i { display: block; width: 160px; height: 2px; background: #2a2622; overflow: hidden; }
      #cover i::after { content: ''; display: block; height: 100%; width: calc(var(--p, 0) * 100%); background: #c9a878;
        transition: width .2s; }
    </style>
  </head>
  <body>
    <div id="info"></div>
    <div id="cover"><i></i></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
