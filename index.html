<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paahde</title>
    <meta name="description" content="A multiplayer survival game in a burning desert: salvage the machines, find water, bring down the giants. Plays in the browser." />
    <meta name="theme-color" content="#3a2a2c" />
    <meta name="color-scheme" content="dark" />
    <!-- Icons and the link preview are rendered from public/favicon.svg and public/landing.svg by tools/favicon.mjs. -->
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="canonical" href="https://herkku.org/dadajam/" />
    <!-- Link previews need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Paahde" />
    <meta property="og:title" content="Paahde" />
    <meta property="og:description" content="A multiplayer survival game in a burning desert: salvage the machines, find water, bring down the giants." />
    <meta property="og:url" content="https://herkku.org/dadajam/" />
    <meta property="og:image" content="https://herkku.org/dadajam/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Paahde: a low sun over orange dunes, a wreck in the sand and a walker far off" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="./fonts/neuropol.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Every bit of text in the game is monospace, but for titles, the prologue and the death screen: Neuropol
         (public/fonts, CC0). The prologue's worker loads it on its own (src/prologueWorker.ts). */
      @font-face { font-family: Neuropol; src: url(./fonts/neuropol.woff2) format('woff2'); font-display: swap; }
      :root { --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; --title: Neuropol, var(--mono); }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: var(--mono); }
      canvas { display: block; }
      /* Stats line, under the graphs (src/statsGraph.ts): off unless "Show stats" is ticked in the Esc menu (src/menu.ts). */
      #info { position: fixed; top: 192px; left: 8px; color: #ccc; font: 12px var(--mono); display: none;
        pointer-events: none; text-shadow: 0 1px 2px #000; }
      /* Loading cover: up from the first paint until the world is built and warmed (src/main.ts), with the prologue
         and its loading bar drawn on it (src/prologue.ts). */
      #cover { position: fixed; inset: 0; z-index: 25; background: #050403; pointer-events: none; transition: opacity .4s;
        user-select: none; -webkit-user-select: none; }
      #cover canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="info"></div>
    <div id="cover"></div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
