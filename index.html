<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hiekka</title>
    <link rel="icon" href="data:," />
    <link rel="preload" href="./fonts/neuropol.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Every bit of text in the game is monospace, but for titles, the prologue and the death screen: Neuropol
         (public/fonts, CC0). The prologue's worker loads it on its own (src/prologueWorker.ts). */
      @font-face { font-family: Neuropol; src: url(./fonts/neuropol.woff2) format('woff2'); font-display: swap; }
      :root { --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; --title: Neuropol, var(--mono); }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: var(--mono); }
      canvas { display: block; }
      /* Stats line: off unless "Show stats" is ticked in the Esc menu (src/menu.ts). */
      #info { position: fixed; top: 8px; left: 8px; color: #ccc; font: 12px var(--mono); display: none;
        pointer-events: none; text-shadow: 0 1px 2px #000; }
      /* Loading cover: up from the first paint until the world is built and warmed (src/main.ts), with the prologue
         and its loading bar drawn on it (src/prologue.ts). */
      #cover { position: fixed; inset: 0; z-index: 25; background: #050403; pointer-events: none; transition: opacity .4s;
        user-select: none; -webkit-user-select: none; }
      #cover canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="info"></div>
    <div id="cover"></div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
